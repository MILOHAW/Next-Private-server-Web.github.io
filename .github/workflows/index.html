<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Next-Private-Server Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Game & UI Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Sniglet:wght@800&family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">

  <!-- Firebase Realtime Database SDKs for GitHub Pages static server chat -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .font-game {
      font-family: 'Fredoka One', 'Sniglet', cursive;
    }

    /* Background Fade-In Animation */
    .bg-sky-fade {
      background: url('https://www.bigbluebubble.com/wp-content/uploads/2020/03/Mirror-Water-Island-Sky.jpg') no-repeat center center / cover;
      animation: skyFadeIn 1.5s ease-out forwards;
    }

    @keyframes skyFadeIn {
      from { opacity: 0; transform: scale(1.03); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Wood Frame Styling for Main Modal */
    .wood-modal-frame {
      background: radial-gradient(circle at center, #3a223f 0%, #1e1027 100%);
      border: 6px solid #5a3319;
      outline: 3px solid #1c0a03;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 40px rgba(0, 0, 0, 0.7);
    }

    @media (min-width: 640px) {
      .wood-modal-frame {
        border-width: 8px;
        outline-width: 4px;
      }
    }

    /* Top Wooden Register Banner */
    .top-banner-arch {
      background: linear-gradient(180deg, #7c4822 0%, #4a2811 100%);
      border: 2px solid #2e1506;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }

    .cyan-title-banner {
      background: linear-gradient(180deg, #00f2fe 0%, #0097b2 100%);
      border: 3px solid #3d1e0a;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4), inset 0 2px 4px rgba(255,255,255,0.4);
      text-shadow: 1.5px 1.5px 0px #054552;
    }

    /* Wood Log Card Tiles */
    .wood-card-tile {
      background: linear-gradient(180deg, #6a3c1b 0%, #44220b 100%);
      border: 3px solid #2e1506;
      box-shadow: 0 6px 12px rgba(0,0,0,0.5), inset 0 2px 4px rgba(255,255,255,0.2);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .wood-card-tile:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.7), 0 0 12px rgba(0,242,254,0.3);
      border-color: #00e1ff;
    }

    .wood-card-tile:active {
      transform: translateY(1px) scale(0.98);
    }

    .blue-card-inner {
      background: radial-gradient(circle at center, #2575fc 0%, #1a44a5 100%);
      border: 2px solid #112763;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5);
    }

    /* Custom Scrollbar for Chat & News */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #00b4d8;
      border-radius: 4px;
    }
  </style>

  <script>
    /* Firebase Realtime Chat Config (Public Endpoint for GitHub Pages Deployment) */
    const firebaseConfig = {
      databaseURL: "https://nps-portal-default-rtdb.firebaseio.com"
    };

    let db = null;
    let chatRef = null;

    function initFirebaseChat() {
      if (!window.firebase) return;
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        chatRef = db.ref('global_portal_chat');
      } catch (err) {
        console.warn("Realtime Server Database setup note:", err);
      }
    }

    const sectionsData = {
      news: {
        title: 'LATEST NEWS (@NPSAnnoucements)',
        html: `
          <div class="space-y-3 sm:space-y-4">
            <div class="p-2.5 sm:p-3 bg-cyan-950/50 rounded-xl border border-cyan-700/50 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
              <div class="flex items-center gap-2">
                <i class="fa-brands fa-telegram text-cyan-400 text-xl sm:text-2xl"></i>
                <div>
                  <div class="font-game text-xs sm:text-sm text-cyan-200">Official Telegram Feed</div>
                  <div class="text-[10px] text-gray-300 font-body">Live updates from t.me/NPSAnnoucements</div>
                </div>
              </div>
              <a href="https://t.me/NPSAnnoucements" target="_blank" class="w-full sm:w-auto text-center px-3 py-1.5 bg-cyan-500 hover:bg-cyan-400 text-white rounded-lg font-game text-xs transition-transform active:scale-95 flex items-center justify-center gap-1.5">

                <i class="fa-solid fa-circle-notch animate-spin text-cyan-400 text-xl mr-3"></i>
                <span class="font-game text-xs sm:text-sm text-cyan-200">Fetching latest announcements...</span>
              </div>
            </div>
          </div>
        `
      },
      download: {
        title: 'DOWNLOAD NEXT-PRIVATE-SERVER',
        html: `

            <div class="p-4 sm:p-5 bg-gradient-to-b from-blue-900/60 to-indigo-950/80 rounded-2xl border-2 border-cyan-500/50 shadow-xl space-y-3 sm:space-y-4">
              <div class="w-12 h-12 sm:w-16 sm:h-16 mx-auto rounded-2xl bg-cyan-500/20 border border-cyan-400/40 flex items-center justify-center text-cyan-300 text-2xl sm:text-3xl">

                <p class="text-[11px] sm:text-xs text-gray-300 font-body mt-1">Get official Android APK files and update changelogs.</p>
              </div>

              <a href="https://github.com/Nextstars1/Next-Private-Server/releases" target="_blank" class="inline-flex items-center justify-center gap-2 sm:gap-3 px-6 sm:px-8 py-2.5 sm:py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-game text-xs sm:text-base rounded-2xl shadow-lg border-2 border-emerald-300/40 transition-transform hover:scale-105 active:scale-95 w-full sm:w-auto">
                <i class="fa-solid fa-download text-sm sm:text-xl"></i>

                <i class="fa-solid fa-external-link text-[10px] sm:text-xs opacity-75"></i>

            <!-- Client Status Cards -->

                <div class="font-game text-xs text-emerald-400 flex items-center justify-between">
                  <span><i class="fa-solid fa-mobile-screen mr-1.5"></i> Android Client</span>
                  <span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 rounded text-[9px] font-game">AVAILABLE</span>
                </div>
                <div class="text-[11px] text-gray-300 font-body mt-1">Direct APK download & installation supported.</div>
              </div>
              
              <div class="p-3 bg-black/40 rounded-xl border border-amber-800/50">
                <div class="font-game text-xs text-amber-300 flex items-center justify-between">
                  <span><i class="fa-solid fa-desktop mr-1.5"></i> Windows Client</span>

                </div>
                <div class="text-[11px] text-amber-200/80 font-body mt-1">Standalone PC launcher is currently in development.</div>
              </div>
            </div>
          </div>
        `
      },
      support: {
        title: 'GLOBAL SUPPORT CHAT',
        html: `
          <div class="flex flex-col h-[260px] sm:h-[300px] space-y-2.5 sm:space-y-3">
            <div class="flex items-center justify-between bg-black/40 p-2 rounded-xl border border-amber-800/40">
              <div id="chatServerStatus" class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-game text-xs text-cyan-200">SERVER ONLINE (LIVE SYNC)</span>
              </div>
              <input id="chatUser" type="text" value="Player_${Math.floor(1000 + Math.random()*9000)}" class="bg-black/60 border border-cyan-500/50 rounded-lg px-2 py-1 text-[11px] text-yellow-300 font-game focus:outline-none w-28 sm:w-32 text-center" title="Change your nickname">
            </div>

            <!-- Chat Messages Log -->
            <div id="chatMessages" class="flex-1 bg-black/60 rounded-xl border border-amber-900/40 p-3 overflow-y-auto space-y-2 font-body text-xs">
              <div class="h-full flex flex-col items-center justify-center text-center p-4 text-gray-400">
                <i class="fa-solid fa-circle-notch animate-spin text-cyan-400 text-2xl mb-2"></i>
                <p class="font-game text-xs text-cyan-200">Connecting to Live Server Chat...</p>
              </div>
            </div>

            <!-- Message Input Form -->
            <form onsubmit="sendChatMessage(event)" class="flex gap-2">
              <input id="chatInput" type="text" placeholder="Type a message to all players..." required class="flex-1 bg-black/70 border border-amber-800/60 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyan-400">
              <button type="submit" class="cyan-title-banner px-3 sm:px-4 py-2 rounded-xl text-xs font-game hover:brightness-110 active:scale-95 transition-transform flex items-center gap-1.5">
                <span>SEND</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
              </button>
            </form>
          </div>
        `
      },
      media: {
        title: 'COMMUNITY & MEDIA CHANNELS',
        html: `
          <div class="space-y-3 sm:space-y-4">
            <p class="text-xs text-cyan-200 text-center font-body">Connect with official Next-Private-Server channels across the web!</p>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 sm:gap-3.5">
              
              <!-- YouTube -->
              <a href="https://www.youtube.com/@NPSChannel1" target="_blank" class="p-3 bg-gradient-to-br from-red-700 to-red-900 hover:from-red-600 hover:to-red-800 rounded-xl border border-red-500/50 flex items-center justify-between group transition-transform hover:scale-105">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl sm:text-2xl text-white">
                    <i class="fa-brands fa-youtube"></i>
                  </div>
                  <div>
                    <div class="font-game text-xs sm:text-sm text-white">YouTube Channel</div>
                    <div class="text-[10px] text-red-200 font-body">@NPSChannel1</div>
                  </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-white/70 group-hover:text-white text-xs"></i>
              </a>

              <!-- Telegram Chat -->
              <a href="https://t.me/NextPrivateServer" target="_blank" class="p-3 bg-gradient-to-br from-sky-600 to-blue-800 hover:from-sky-500 hover:to-blue-700 rounded-xl border border-sky-400/50 flex items-center justify-between group transition-transform hover:scale-105">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl sm:text-2xl text-white">
                    <i class="fa-brands fa-telegram"></i>
                  </div>
                  <div>
                    <div class="font-game text-xs sm:text-sm text-white">Telegram Chat</div>
                    <div class="text-[10px] text-sky-200 font-body">t.me/NextPrivateServer</div>
                  </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-white/70 group-hover:text-white text-xs"></i>
              </a>

              <!-- Telegram Announcements -->
              <a href="https://t.me/NPSAnnoucements" target="_blank" class="p-3 bg-gradient-to-br from-cyan-600 to-teal-800 hover:from-cyan-500 hover:to-teal-700 rounded-xl border border-cyan-400/50 flex items-center justify-between group transition-transform hover:scale-105">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl sm:text-2xl text-white">
                    <i class="fa-solid fa-bullhorn"></i>
                  </div>
                  <div>
                    <div class="font-game text-xs sm:text-sm text-white">Telegram News</div>
                    <div class="text-[10px] text-cyan-200 font-body">t.me/NPSAnnoucements</div>
                  </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-white/70 group-hover:text-white text-xs"></i>
              </a>

              <!-- Discord Server -->
              <a href="https://discord.gg/DGydEdnbF2" target="_blank" class="p-3 bg-gradient-to-br from-indigo-600 to-purple-800 hover:from-indigo-500 hover:to-purple-700 rounded-xl border border-indigo-400/50 flex items-center justify-between group transition-transform hover:scale-105">
                <div class="flex items-center gap-3">
                  <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl sm:text-2xl text-white">
                    <i class="fa-brands fa-discord"></i>
                  </div>
                  <div>
                    <div class="font-game text-xs sm:text-sm text-white">Discord Community</div>
                    <div class="text-[10px] text-indigo-200 font-body">discord.gg/DGydEdnbF2</div>
                  </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-white/70 group-hover:text-white text-xs"></i>
              </a>

            </div>
          </div>
        `
      }
    };

    function openSection(sectionKey, titleOverride) {
      const gridView = document.getElementById('gridView');
      const detailView = document.getElementById('detailView');
      const backBtn = document.getElementById('backBtn');
      const bottomBar = document.getElementById('bottomBar');
      const headerTitle = document.getElementById('headerTitle');

      if (sectionKey === 'comingsoon') {
        detailView.innerHTML = `
          <div class="text-center py-6 space-y-3">
            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-full bg-amber-500/20 border-2 border-amber-500/40 mx-auto flex items-center justify-center text-amber-300 text-xl sm:text-2xl">
              <i class="fa-solid fa-hourglass-half animate-spin"></i>
            </div>
            <h3 class="font-game text-xl sm:text-2xl text-amber-300">${titleOverride ? titleOverride.toUpperCase() : 'FEATURE COMING SOON'}</h3>
            <p class="text-xs text-gray-300 font-body max-w-md mx-auto px-2">The Next-Private-Server developers are currently preparing this feature for an upcoming patch update!</p>
            <div class="pt-2">
              <span class="inline-block px-4 py-1 bg-amber-950/80 border border-amber-700/60 rounded-full font-game text-[11px] sm:text-xs text-amber-200">
                ESTIMATED RELEASE: UPCOMING PATCH
              </span>
            </div>
          </div>
        `;
        headerTitle.innerText = "COMING SOON";
      } else {
        const data = sectionsData[sectionKey];
        if (!data) return;
        headerTitle.innerText = data.title;
        detailView.innerHTML = data.html;

        if (sectionKey === 'news') {
          loadTelegramNewsFeed();
        } else if (sectionKey === 'support') {
          initChatRoom();
        }
      }

      gridView.classList.add('hidden');
      detailView.classList.remove('hidden');
      backBtn.classList.remove('hidden');
      bottomBar.classList.add('hidden');
    }

    function showGridView() {
      document.getElementById('gridView').classList.remove('hidden');
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      document.getElementById('bottomBar').classList.remove('hidden');
      document.getElementById('headerTitle').innerText = "NEXT-PRIVATE-SERVER";
    }

    async function loadTelegramNewsFeed() {
      const container = document.getElementById('newsFeedList');
      if (!container) return;

      const fallbackPosts = [
        {
          title: "Next-Private-Server Major Update Released!",
          text: "Welcome to the latest release! Enjoy new game features, enhanced server performance, and stability fixes.",
          time: "Recently",
          link: "https://t.me/NPSAnnoucements"
        },
        {
          title: "Discord Community & Support",
          text: "Join our official Discord server to connect with developers, view updates, and chat with other players!",
          time: "Recently",
          link: "https://discord.gg/DGydEdnbF2"
        },
        {
          title: "YouTube Channel Showcase (@NPSChannel1)",
          text: "New gameplay preview videos and channel updates are live now on YouTube!",
          time: "Recently",
          link: "https://www.youtube.com/@NPSChannel1"
        }
      ];

      try {
        const response = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent('https://t.me/s/NPSAnnoucements'));
        if (!response.ok) throw new Error("Network error");
        
        const htmlText = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const messages = doc.querySelectorAll('.tgme_widget_message');

        if (messages.length > 0) {
          let html = '';
          messages.forEach((msg, idx) => {
            if (idx > 5) return;
            const textEl = msg.querySelector('.tgme_widget_message_text');
            const timeEl = msg.querySelector('.tgme_widget_message_date time');
            const photoEl = msg.querySelector('.tgme_widget_message_photo_wrap');

            const text = textEl ? textEl.innerText : 'Announcement update';
            const time = timeEl ? timeEl.innerText : 'Recently';
            let photoUrl = '';
            
            if (photoEl && photoEl.style.backgroundImage) {
              const match = photoEl.style.backgroundImage.match(/url\(['"]?(.*?)['"]?\)/);
              if (match) photoUrl = match[1];
            }

            html += `
              <div class="p-3.5 bg-amber-950/40 rounded-xl border border-amber-800/40 space-y-2">
                <div class="flex justify-between items-start gap-2">
                  <span class="font-game text-xs text-yellow-300 flex items-center gap-1.5">
                    <i class="fa-brands fa-telegram text-cyan-400"></i>
                    <span>@NPSAnnoucements</span>
                  </span>
                  <span class="text-[10px] text-gray-400 font-body">${time}</span>
                </div>
                ${photoUrl ? `<img src="${photoUrl}" class="w-full max-h-40 sm:max-h-48 object-cover rounded-lg border border-cyan-900/50" />` : ''}
                <p class="text-xs text-gray-200 font-body leading-relaxed whitespace-pre-line">${text}</p>
                <div class="pt-1 flex justify-end">
                  <a href="https://t.me/NPSAnnoucements" target="_blank" class="text-[11px] font-game text-cyan-300 hover:underline flex items-center gap-1">
                    <span>View Post</span>
                    <i class="fa-solid fa-arrow-right"></i>
                  </a>
                </div>
              </div>
            `;
          });
          container.innerHTML = html;
          return;
        }
      } catch (err) {
        console.log('Telegram preview fallback:', err);
      }

      container.innerHTML = fallbackPosts.map(post => `
        <div class="p-3 bg-amber-950/40 rounded-xl border border-amber-800/40 space-y-2">
          <div class="flex justify-between items-start gap-2">
            <span class="font-game text-xs text-yellow-300 flex items-center gap-1.5">
              <i class="fa-brands fa-telegram text-cyan-400"></i>
              <span>${post.title}</span>
            </span>
            <span class="text-[10px] text-gray-400 font-body">${post.time}</span>
          </div>
          <p class="text-xs text-gray-200 font-body leading-relaxed">${post.text}</p>
          <div class="pt-1 flex justify-end">
            <a href="${post.link}" target="_blank" class="text-[11px] font-game text-cyan-300 hover:underline flex items-center gap-1">
              <span>View on Telegram</span>
              <i class="fa-solid fa-arrow-right"></i>
            </a>
          </div>
        </div>
      `).join('');
    }

    function initChatRoom() {
      const chatBox = document.getElementById('chatMessages');
      const statusBox = document.getElementById('chatServerStatus');
      if (!chatBox) return;

      if (!db && window.firebase) {
        initFirebaseChat();
      }

      if (chatRef) {
        if (statusBox) {
          statusBox.innerHTML = `
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="font-game text-xs text-cyan-200">SERVER ONLINE (LIVE SYNC)</span>
          `;
        }

        // Subscribe to live real-time cloud messages
        chatRef.limitToLast(40).on('value', (snapshot) => {
          const data = snapshot.val();
          if (!data) {
            chatBox.innerHTML = `
              <div class="h-full flex flex-col items-center justify-center text-center p-4 text-gray-400">
                <i class="fa-solid fa-cloud text-3xl mb-2 text-cyan-500/40"></i>
                <p class="font-game text-xs text-cyan-200/80">Connected to Live Server Chat!</p>
                <p class="text-[11px] text-gray-400 mt-0.5">No messages yet. Send a message to start chatting.</p>
              </div>
            `;
            return;
          }

          const currentUser = document.getElementById('chatUser')?.value.trim() || '';
          let html = '';
          Object.keys(data).forEach((key) => {
            const msg = data[key];
            msg.isSelf = (msg.user === currentUser);
            html += renderChatMessage(msg);
          });
          chatBox.innerHTML = html;
          chatBox.scrollTop = chatBox.scrollHeight;
        });
      } else {
        if (statusBox) {
          statusBox.innerHTML = `
            <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
            <span class="font-game text-xs text-amber-200">LOCAL SERVER MODE</span>
          `;
        }
        chatBox.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-center p-4 text-gray-400">
            <i class="fa-solid fa-comments text-3xl mb-2 text-cyan-500/40"></i>
            <p class="font-game text-xs text-cyan-200/80">Welcome to Global Support Chat!</p>
            <p class="text-[11px] text-gray-400 mt-0.5">Send a message to start chatting.</p>
          </div>
        `;
      }
    }

    function renderChatMessage(msg) {
      const isSelf = msg.isSelf;
      const badgeColor = msg.badge === 'ADMIN' ? 'bg-red-500/30 text-red-300 border-red-500/50' : 'bg-cyan-500/30 text-cyan-300 border-cyan-500/50';
      
      return `
        <div class="flex flex-col ${isSelf ? 'items-end' : 'items-start'} my-1">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="font-game text-[11px] ${isSelf ? 'text-yellow-300' : 'text-cyan-300'}">${msg.user}</span>
            <span class="px-1.5 py-0.2 rounded text-[9px] font-game border ${badgeColor}">${msg.badge || 'Player'}</span>
            <span class="text-[9px] text-gray-400 font-body">${msg.time || ''}</span>
          </div>
          <div class="px-3 py-1.5 rounded-2xl ${isSelf ? 'bg-cyan-700 text-white rounded-tr-none' : 'bg-black/80 text-gray-200 border border-amber-900/40 rounded-tl-none'} max-w-[85%] font-body">
            ${msg.text}
          </div>
        </div>
      `;
    }

    function sendChatMessage(e) {
      e.preventDefault();

      const user = document.getElementById('chatUser').value.trim() || 'Player';
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
      const newMsg = { user, text, time, badge: 'Player', timestamp: Date.now() };

      if (chatRef) {
        // Broadcast message to live server database
        chatRef.push(newMsg);
      } else {
        const chatBox = document.getElementById('chatMessages');
        if (chatBox) {
          newMsg.isSelf = true;
          chatBox.insertAdjacentHTML('beforeend', renderChatMessage(newMsg));
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }

      input.value = '';
    }

    let isClosed = false;
    let canvas = null;
    let ctx = null;
    let processedIslandCanvas = null;

    let camera = {
      x: 0,
      y: 0,
      scale: 1,
      isDragging: false,
      startX: 0,
      startY: 0
    };

    function createProceduralIslandCanvas() {
      const pCanvas = document.createElement('canvas');
      pCanvas.width = 900;
      pCanvas.height = 650;
      const pCtx = pCanvas.getContext('2d');
      const cx = pCanvas.width / 2;
      const cy = pCanvas.height / 2 + 30;

      // Base Shadow
      pCtx.beginPath();
      pCtx.ellipse(cx, cy + 140, 320, 70, 0, 0, Math.PI * 2);
      pCtx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      pCtx.fill();

      // Rock Body
      pCtx.beginPath();
      pCtx.moveTo(cx - 300, cy);
      pCtx.bezierCurveTo(cx - 280, cy + 180, cx - 100, cy + 240, cx, cy + 230);
      pCtx.bezierCurveTo(cx + 100, cy + 240, cx + 280, cy + 180, cx + 300, cy);
      pCtx.bezierCurveTo(cx + 200, cy + 40, cx - 200, cy + 40, cx - 300, cy);
      pCtx.closePath();
      const rockGrad = pCtx.createLinearGradient(cx, cy, cx, cy + 240);
      rockGrad.addColorStop(0, '#4a2c11');
      rockGrad.addColorStop(0.5, '#2e1908');
      rockGrad.addColorStop(1, '#170a02');
      pCtx.fillStyle = rockGrad;
      pCtx.fill();
      pCtx.strokeStyle = '#100501';
      pCtx.lineWidth = 6;
      pCtx.stroke();

      // Grass Top
      pCtx.beginPath();
      pCtx.ellipse(cx, cy, 310, 110, 0, 0, Math.PI * 2);
      const grassGrad = pCtx.createRadialGradient(cx, cy - 30, 20, cx, cy, 310);
      grassGrad.addColorStop(0, '#74c69d');
      grassGrad.addColorStop(0.5, '#2d6a4f');
      grassGrad.addColorStop(1, '#1b4332');
      pCtx.fillStyle = grassGrad;
      pCtx.fill();
      pCtx.strokeStyle = '#4a2816';
      pCtx.lineWidth = 8;
      pCtx.stroke();

      // Tree Foliage
      pCtx.beginPath();
      pCtx.arc(cx, cy - 160, 60, 0, Math.PI * 2);
      pCtx.fillStyle = '#52b788';
      pCtx.fill();

      return pCanvas;
    }

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      renderIsland();
    }

    function resetIslandCamera() {
      camera.scale = Math.min(window.innerWidth / 900, window.innerHeight / 700) * 0.95;
      camera.x = window.innerWidth / 2;
      camera.y = window.innerHeight / 2 + 30;
      renderIsland();
    }

    function zoomIsland(delta) {
      camera.scale = Math.max(0.3, Math.min(3.0, camera.scale + delta));
      renderIsland();
    }

    function renderIsland() {
      if (!canvas || !ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const imgToDraw = processedIslandCanvas;
      if (!imgToDraw) return;

      ctx.save();
      ctx.translate(camera.x, camera.y);
      ctx.scale(camera.scale, camera.scale);

      const drawW = imgToDraw.width || 800;
      const drawH = imgToDraw.height || 600;

      try {
        ctx.drawImage(imgToDraw, -drawW / 2, -drawH / 2, drawW, drawH);
      } catch (err) {
        console.error("Island rendering error avoided:", err);
      }

      ctx.restore();
    }

    function toggleCloseModal() {
      const container = document.getElementById('mainContainer');
      const reopenBtn = document.getElementById('reopenBtn');
      const controls = document.getElementById('cameraControls');
      const hint = document.getElementById('dragHint');

      if (!isClosed) {
        container.style.transform = 'scale(0) translateY(100px)';
        container.style.opacity = '0';
        setTimeout(() => {
          container.classList.add('hidden');
          reopenBtn.classList.remove('hidden');
          controls.classList.remove('hidden');
          hint.classList.remove('hidden');
        }, 300);
        isClosed = true;
      } else {
        container.classList.remove('hidden');
        reopenBtn.classList.add('hidden');
        controls.classList.add('hidden');
        hint.classList.add('hidden');
        setTimeout(() => {
          container.style.transform = 'scale(1) translateY(0)';
          container.style.opacity = '1';
        }, 10);
        isClosed = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initFirebaseChat();
      canvas = document.getElementById('islandCanvas');
      if (canvas) {
        ctx = canvas.getContext('2d');
      }

      processedIslandCanvas = createProceduralIslandCanvas();

      let islandImg = new Image();
      islandImg.crossOrigin = "Anonymous";
      islandImg.src = "https://tiermaker.com/images/template_images/2022/15851595/my-singing-monster-plant-island-15851595/colossalplant.png";

      islandImg.onload = () => {
        if (islandImg.naturalWidth > 0) {
          try {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = islandImg.width;
            tempCanvas.height = islandImg.height;
            const pCtx = tempCanvas.getContext('2d');
            pCtx.drawImage(islandImg, 0, 0);

            const imgData = pCtx.getImageData(0, 0, islandImg.width, islandImg.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
              if (data[i] > 235 && data[i + 1] > 235 && data[i + 2] > 235) {
                data[i + 3] = 0;
              }
            }
            pCtx.putImageData(imgData, 0, 0);
            processedIslandCanvas = tempCanvas;
          } catch (e) {
            console.warn("Cross-origin restriction encountered; using procedural island.");
          }
        }
        resetIslandCamera();
      };

      islandImg.onerror = () => {
        console.warn("External island image failed to load. Using procedural fallback.");
        resetIslandCamera();
      };

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
      resetIslandCamera();

      // Camera Drag Listeners
      const viewport = document.getElementById('islandViewport');
      if (viewport) {
        viewport.addEventListener('mousedown', (e) => {
          camera.isDragging = true;
          camera.startX = e.clientX - camera.x;
          camera.startY = e.clientY - camera.y;
        });

        window.addEventListener('mousemove', (e) => {
          if (!camera.isDragging) return;
          camera.x = e.clientX - camera.startX;
          camera.y = e.clientY - camera.startY;
          renderIsland();
        });

        window.addEventListener('mouseup', () => { camera.isDragging = false; });

        viewport.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            camera.isDragging = true;
            camera.startX = e.touches[0].clientX - camera.x;
            camera.startY = e.touches[0].clientY - camera.y;
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (!camera.isDragging || e.touches.length !== 1) return;
          camera.x = e.touches[0].clientX - camera.startX;
          camera.y = e.touches[0].clientY - camera.startY;
          renderIsland();
        }, { passive: true });

        window.addEventListener('touchend', () => { camera.isDragging = false; });

        viewport.addEventListener('wheel', (e) => {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 0.08 : -0.08;
          zoomIsland(zoomFactor);
        }, { passive: false });
      }

      // Ambient floating particles
      const container = document.getElementById('particles');
      if (container) {
        for (let i = 0; i < 18; i++) {
          const p = document.createElement('div');
          const size = Math.random() * 4 + 2;
          p.className = 'absolute rounded-full bg-cyan-300/30 blur-[1px] pointer-events-none';
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
          p.style.left = `${Math.random() * 100}%`;
          p.style.top = `${Math.random() * 100}%`;
          
          p.animate([
            { transform: 'translateY(0px) scale(1)', opacity: Math.random() * 0.5 + 0.2 },
            { transform: `translateY(-${Math.random() * 60 + 30}px) scale(1.2)`, opacity: 0 }
          ], {
            duration: Math.random() * 4000 + 3000,
            iterations: Infinity,
            delay: Math.random() * 2000
          });

          container.appendChild(p);
        }
      }
    });
  </script>
